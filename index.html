<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gravador de Tela Marcelo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gravador de Tela Notebook</h1>
        <video id="preview" autoplay muted playsinline style="width:100%; max-width:500px; background:#000;"></video>
        
        <div class="controls">
            <button id="selectBtn">1. Selecionar Tela</button>
            <button id="startBtn" disabled>2. Gravar</button>
            <button id="stopBtn" disabled>3. Parar e Baixar</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
