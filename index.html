<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecPWA - Gravador de Tela</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gravador de Tela Pro</h1>
        
        <div class="status-bar">
            <span id="timer">00:00:00</span>
            <span id="status-text">Pronto para iniciar</span>
        </div>

        <video id="preview" autoplay muted></video>

        <div class="controls">
            <button id="selectBtn">🖥️ Selecionar Tela/Janela</button>
            <button id="startBtn" disabled>▶️ Iniciar</button>
            <button id="pauseBtn" disabled>⏸️ Pausar</button>
            <button id="stopBtn" disabled>⏹️ Parar</button>
        </div>

        <div class="settings">
            <label>
                <input type="checkbox" id="autoDownload" checked> Download Automático ao finalizar
            </label>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
